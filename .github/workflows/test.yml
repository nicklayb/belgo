# Format, warnings, Credo, tests and the Helm chart (`just check`) in the Nix dev
# shell, so CI uses the same toolchain as development; pull requests changing the
# chart must bump its version. Runs for pull requests to main, and is called
# by the release workflow before anything is released.
name: Tests

on:
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: Format, warnings, Credo and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Mix dependencies and builds
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
            .nix-mix
            .nix-hex
          key: ${{ runner.os }}-mix-${{ hashFiles('mix.lock', 'flake.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      # Published chart versions are never replaced: a chart change needs a new one.
      - name: Chart version bumped
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "$GITHUB_BASE_REF"
          nix shell --inputs-from . nixpkgs#just --command just chart-version-bumped "origin/$GITHUB_BASE_REF"

      - name: Check
        run: nix develop --command just check
