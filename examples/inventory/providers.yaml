# Providers Belgo discovers records from and pushes devices to.
# mode: disabled (not used) | read (discovery only, the default) | write (discovery
# and push of saved devices; needs a token with write privileges).
# interval: pull periodically (30s, 5m, 1h…); without it, at boot and on demand.
# Secrets come from the environment (or *_FILE pointing to a file holding the value):
#   OPNsense: BELGO_OPNSENSE_API_KEY / BELGO_OPNSENSE_API_SECRET
#   AdGuard Home: BELGO_ADGUARD_USERNAME / BELGO_ADGUARD_PASSWORD
#   Omada: BELGO_OMADA_CLIENT_ID / BELGO_OMADA_CLIENT_SECRET (an Open API application
#   in client mode: Settings > Platform Integration > Open API)
#   Home Assistant: BELGO_HOME_ASSISTANT_TOKEN (long-lived access token, read only)
#   Prometheus: optional BELGO_PROMETHEUS_TOKEN (bearer; a Grafana service account
#   token, role Viewer, when queried through Grafana)
#   Proxmox VE: BELGO_PROXMOX_TOKEN_ID (belgo@pve!belgo) / BELGO_PROXMOX_TOKEN_SECRET
#   (API token with the PVEAuditor role on /)
version: 1
providers:
  opnsense:
    mode: read
    interval: 5m
    url: https://opnsense.home.lan
    verify_tls: true
    # never (default) | interface_deletion: delete the Kea reservations of deleted
    # devices / interfaces (and of changed MACs), in write mode only.
    delete_reservation: never
    # Wake devices through the os-wol plugin (packet sent by the router, on the right
    # interface; privileges "Services: Wake on LAN" and "Status: Interfaces").
    # false hides the Wake button.
    wake_on_lan: true
  adguard:
    mode: read
    url: https://adguard.home.lan
    verify_tls: true
  omada:
    mode: read
    interval: 1m
    url: https://omada.home.lan:8043
    omada_id: your-omada-id
    site: Default
    verify_tls: true
  home_assistant:
    mode: read
    interval: 1h
    url: https://homeassistant.home.lan:8123
    verify_tls: true
  # Read only: pods and Docker containers per host (Hosting page).
  prometheus:
    interval: 1m
    # Grafana in front of Prometheus (data source proxy); or Prometheus itself
    # (http://prometheus.home.lan:9090) without datasource_uid.
    url: http://grafana.home.lan:3000
    datasource_uid: your-prometheus-datasource-uid
    # Pods of these namespaces only (all when absent).
    namespaces: [default]
    # Device of cAdvisor scrape targets whose host name is no device name.
    instances:
      "cadvisor:8080": monitor
  # Read only: which node runs each VM / LXC container (Set host on divergences).
  proxmox:
    interval: 5m
    url: https://pve.home.lan:8006
    verify_tls: false
