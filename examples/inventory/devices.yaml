    location_id: bureau-nicolas
    name: OPNsense
    network_role: gateway
  apple-tv-salon:
    interfaces:
      - assignment: reserved
        ip: 192.168.1.30
        mac: 02:00:00:00:00:30
        network_id: lan
    kind: media
    location_id: salon
    name: Apple TV Salon
  hades:
    interfaces:
      - assignment: reserved
        ip: 192.168.1.10
        mac: 02:00:00:00:00:10
        name: eth0
        network_id: lan
        switch_id: switch-bureau
        switch_port: '3'
    kind: workstation
    location_id: bureau-nicolas
